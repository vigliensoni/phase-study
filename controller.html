<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Phase Controller</title>
<script>
  // Apply saved theme before first paint (light is the default)
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  /* Light theme (default) */
  :root {
    --bg: #f5f3ee;
    --fg: #1a1a1a;
    --accent: #4d7a00;
    --dim: #d3cec3;
    --mid: #66645e;
    --faint: #9a978f;
    --c2: #d9480f;
    --cp: #0077a8;
    --on-accent: #ffffff;
  }

  /* Dark theme */
  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --fg: #e8e4d9;
    --accent: #c8ff00;
    --dim: #2a2a2a;
    --mid: #666;
    --faint: #333;
    --c2: #ff6b35;
    --cp: #00d4ff;
    --on-accent: #0a0a0a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Mono', monospace;
    padding-bottom: 3rem;
  }

  /* ── Header ── */
  .hdr {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .hdr-title {
    font-size: 1.05rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .ws-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.73rem;
    letter-spacing: 0.12em;
    color: var(--mid);
    text-transform: uppercase;
  }

  .ws-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--faint);
    transition: background 0.4s;
  }
  .ws-dot.on { background: var(--accent); }

  .theme-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.73rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--dim);
    background: none;
    color: var(--mid);
    cursor: pointer;
    touch-action: manipulation;
  }

  /* ── Status bar ── */
  .status-bar {
    padding: 0.55rem 1.2rem;
    border-bottom: 1px solid var(--dim);
    font-size: 0.77rem;
    letter-spacing: 0.2em;
    color: var(--mid);
    text-transform: uppercase;
  }
  .status-bar span { color: var(--accent); }

  /* ── Sections ── */
  .section {
    padding: 1.1rem 1.2rem;
    border-bottom: 1px solid var(--dim);
  }

  .section-title {
    font-size: 0.73rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* ── Transport buttons ── */
  .btn-col { display: flex; flex-direction: column; gap: 0.6rem; }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 1.14rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 1rem 1rem;
    cursor: pointer;
    width: 100%;
    border: 1px solid;
    background: none;
    touch-action: manipulation;
    transition: background 0.12s, color 0.12s;
  }

  .btn-play  { border-color: var(--accent); color: var(--accent); }
  .btn-play.on { background: var(--accent); color: var(--on-accent); }
  .btn-phase { border-color: var(--cp); color: var(--cp); }
  .btn-phase.paused { background: var(--cp); color: var(--on-accent); }
  .btn-reset { border-color: var(--dim); color: var(--mid); }

  /* ── Sliders ── */
  .ctrl-group { display: flex; flex-direction: column; gap: 1.6rem; }

  .ctrl { display: flex; flex-direction: column; gap: 0.55rem; }

  .ctrl-hd {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .ctrl-name {
    font-size: 0.81rem;
    letter-spacing: 0.1em;
    color: var(--mid);
    text-transform: uppercase;
  }

  .ctrl-val {
    font-size: 1.31rem;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--dim);
    outline: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  input[type=range].r2::-webkit-slider-thumb { background: var(--c2); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">Phase Controller</div>
  <div class="ws-badge">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">◐ Dark</button>
    <div class="ws-dot" id="wsDot"></div>
    Link
  </div>
</div>

<div class="status-bar">Status: <span id="statusTxt">—</span></div>

<!-- Transport -->
<div class="section">
  <div class="section-title">Transport</div>
  <div class="btn-col">
    <button class="btn btn-play"  id="btnPlay"  onclick="send('togglePlay')">▶ &nbsp;Start</button>
    <button class="btn btn-phase" id="btnPhase" onclick="send('togglePhasing')">⏸ &nbsp;Pause phasing</button>
    <button class="btn btn-reset"               onclick="send('resetPhase')">↺ &nbsp;Sync voices</button>
  </div>
</div>

<!-- Voice II -->
<div class="section">
  <div class="section-title">Voice II — Speed</div>
  <div class="ctrl-group">
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Ratio</span>
        <span class="ctrl-val" id="ratioVal">1.0020</span>
      </div>
      <input type="range" class="r2" id="ratioCtrl"
        min="1.0" max="1.03" step="0.0001" value="1.002"
        oninput="slide('ratio', +this.value, 'ratioVal', v => (+v).toFixed(4))">
    </div>
  </div>
</div>

<!-- Master -->
<div class="section">
  <div class="section-title">Master</div>
  <div class="ctrl-group">
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Volume</span>
        <span class="ctrl-val" id="volVal">0.60</span>
      </div>
      <input type="range" id="volCtrl" min="0" max="1" step="0.01" value="0.6"
        oninput="slide('volume', +this.value, 'volVal', v => (+v).toFixed(2))">
    </div>
  </div>
</div>

<script>
let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('on');
    send('requestState');
  };

  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('on');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    const { param, value } = JSON.parse(e.data);
    applyToUI(param, value);
  };
}

function send(param, value) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(value !== undefined ? { param, value } : { param }));
}

function slide(param, value, valId, fmt) {
  document.getElementById(valId).textContent = fmt(value);
  send(param, value);
}

function applyToUI(param, value) {
  const setSlider = (sliderId, valId, fmt) => {
    const s = document.getElementById(sliderId);
    const v = document.getElementById(valId);
    if (s) s.value = value;
    if (v) v.textContent = fmt(value);
  };

  switch (param) {
    case 'ratio':     setSlider('ratioCtrl', 'ratioVal', v => (+v).toFixed(4));      break;
    case 'volume':    setSlider('volCtrl',   'volVal',   v => (+v).toFixed(2));      break;

    case 'statusUpdate': {
      document.getElementById('statusTxt').textContent = value;
      const paused = value === 'PHASE FROZEN';
      const ph = document.getElementById('btnPhase');
      ph.classList.toggle('paused', paused);
      ph.textContent = paused ? '▶   Resume phasing' : '⏸   Pause phasing';
      break;
    }

    case 'playingUpdate': {
      const btn = document.getElementById('btnPlay');
      btn.classList.toggle('on', value);
      btn.textContent = value ? '■   Stop' : '▶   Start';
      break;
    }
  }
}

function toggleTheme() {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark';
  else      delete document.documentElement.dataset.theme;
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  updateThemeBtn();
}

function updateThemeBtn() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.getElementById('themeBtn').textContent = dark ? '◐ Light' : '◐ Dark';
}

updateThemeBtn();
connect();
</script>
</body>
</html>
