<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Phase Controller</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --fg: #e8e4d9;
    --accent: #c8ff00;
    --dim: #2a2a2a;
    --mid: #666;
    --c2: #ff6b35;
    --cp: #00d4ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Mono', monospace;
    padding-bottom: 3rem;
  }

  /* ── Header ── */
  .hdr {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .hdr-title {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .ws-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.42rem;
    letter-spacing: 0.12em;
    color: var(--mid);
    text-transform: uppercase;
  }

  .ws-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 0.4s;
  }
  .ws-dot.on { background: var(--accent); }

  /* ── Status bar ── */
  .status-bar {
    padding: 0.55rem 1.2rem;
    border-bottom: 1px solid var(--dim);
    font-size: 0.44rem;
    letter-spacing: 0.2em;
    color: var(--mid);
    text-transform: uppercase;
  }
  .status-bar span { color: var(--accent); }

  /* ── Sections ── */
  .section {
    padding: 1.1rem 1.2rem;
    border-bottom: 1px solid var(--dim);
  }

  .section-title {
    font-size: 0.42rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* ── Transport buttons ── */
  .btn-col { display: flex; flex-direction: column; gap: 0.6rem; }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 1rem 1rem;
    cursor: pointer;
    width: 100%;
    border: 1px solid;
    background: none;
    touch-action: manipulation;
    transition: background 0.12s, color 0.12s;
  }

  .btn-play  { border-color: var(--accent); color: var(--accent); }
  .btn-play.on { background: var(--accent); color: var(--bg); }
  .btn-phase { border-color: var(--cp); color: var(--cp); }
  .btn-phase.paused { background: var(--cp); color: var(--bg); }
  .btn-reset { border-color: var(--dim); color: var(--mid); }

  /* ── Preset grid ── */
  .preset-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.4rem;
  }

  .preset-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.8rem 0.2rem;
    border: 1px solid var(--dim);
    background: none;
    color: var(--mid);
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 0.1s, color 0.1s;
  }
  .preset-btn:active { border-color: var(--accent); color: var(--accent); }

  /* ── Sliders ── */
  .ctrl-group { display: flex; flex-direction: column; gap: 1.6rem; }

  .ctrl { display: flex; flex-direction: column; gap: 0.55rem; }

  .ctrl-hd {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .ctrl-name {
    font-size: 0.46rem;
    letter-spacing: 0.1em;
    color: var(--mid);
    text-transform: uppercase;
  }

  .ctrl-val {
    font-size: 0.75rem;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--dim);
    outline: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  input[type=range].r2::-webkit-slider-thumb { background: var(--c2); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">Phase Controller</div>
  <div class="ws-badge">
    <div class="ws-dot" id="wsDot"></div>
    Link
  </div>
</div>

<div class="status-bar">Status: <span id="statusTxt">—</span></div>

<!-- Transport -->
<div class="section">
  <div class="section-title">Transport</div>
  <div class="btn-col">
    <button class="btn btn-play"  id="btnPlay"  onclick="send('togglePlay')">▶ &nbsp;Start</button>
    <button class="btn btn-phase" id="btnPhase" onclick="send('togglePhasing')">⏸ &nbsp;Pause phasing</button>
    <button class="btn btn-reset"               onclick="send('resetPhase')">↺ &nbsp;Sync voices</button>
  </div>
</div>

<!-- Presets -->
<div class="section">
  <div class="section-title">Presets</div>
  <div class="preset-grid">
    <button class="preset-btn" onclick="send('loadPreset','rain')">Rain</button>
    <button class="preset-btn" onclick="send('loadPreset','piano')">Piano</button>
    <button class="preset-btn" onclick="send('loadPreset','pentatonic')">Penta</button>
    <button class="preset-btn" onclick="send('loadPreset','clear')">Clear</button>
  </div>
</div>

<!-- Melody -->
<div class="section">
  <div class="section-title">Melody</div>
  <div class="ctrl-group">
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Steps</span>
        <span class="ctrl-val" id="stepsVal">12</span>
      </div>
      <input type="range" id="stepsCtrl" min="4" max="16" step="1" value="12"
        oninput="slide('steps', +this.value, 'stepsVal', v => v)">
    </div>
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Tempo BPM</span>
        <span class="ctrl-val" id="tempoVal">132</span>
      </div>
      <input type="range" id="tempoCtrl" min="40" max="300" step="1" value="132"
        oninput="slide('tempo', +this.value, 'tempoVal', v => v)">
    </div>
  </div>
</div>

<!-- Synthesis -->
<div class="section">
  <div class="section-title">Synthesis</div>
  <div class="ctrl-group">
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Harmonics</span>
        <span class="ctrl-val" id="harmVal">5</span>
      </div>
      <input type="range" id="harmCtrl" min="1" max="12" step="1" value="5"
        oninput="slide('harmonics', +this.value, 'harmVal', v => v)">
    </div>
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Note Duration</span>
        <span class="ctrl-val" id="durVal">80 ms</span>
      </div>
      <input type="range" id="durCtrl" min="20" max="400" step="5" value="80"
        oninput="slide('noteDur', +this.value, 'durVal', v => v + ' ms')">
    </div>
  </div>
</div>

<!-- Voice II -->
<div class="section">
  <div class="section-title">Voice II — Speed</div>
  <div class="ctrl-group">
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Ratio</span>
        <span class="ctrl-val" id="ratioVal">1.0020</span>
      </div>
      <input type="range" class="r2" id="ratioCtrl"
        min="1.0" max="1.03" step="0.0001" value="1.002"
        oninput="slide('ratio', +this.value, 'ratioVal', v => (+v).toFixed(4))">
    </div>
  </div>
</div>

<!-- Master -->
<div class="section">
  <div class="section-title">Master</div>
  <div class="ctrl-group">
    <div class="ctrl">
      <div class="ctrl-hd">
        <span class="ctrl-name">Volume</span>
        <span class="ctrl-val" id="volVal">0.60</span>
      </div>
      <input type="range" id="volCtrl" min="0" max="1" step="0.01" value="0.6"
        oninput="slide('volume', +this.value, 'volVal', v => (+v).toFixed(2))">
    </div>
  </div>
</div>

<script>
let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('on');
    send('requestState');
  };

  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('on');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    const { param, value } = JSON.parse(e.data);
    applyToUI(param, value);
  };
}

function send(param, value) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(value !== undefined ? { param, value } : { param }));
}

function slide(param, value, valId, fmt) {
  document.getElementById(valId).textContent = fmt(value);
  send(param, value);
}

function applyToUI(param, value) {
  const setSlider = (sliderId, valId, fmt) => {
    const s = document.getElementById(sliderId);
    const v = document.getElementById(valId);
    if (s) s.value = value;
    if (v) v.textContent = fmt(value);
  };

  switch (param) {
    case 'harmonics': setSlider('harmCtrl',  'harmVal',  v => v);                    break;
    case 'noteDur':   setSlider('durCtrl',   'durVal',   v => v + ' ms');            break;
    case 'tempo':     setSlider('tempoCtrl', 'tempoVal', v => v);                    break;
    case 'ratio':     setSlider('ratioCtrl', 'ratioVal', v => (+v).toFixed(4));      break;
    case 'volume':    setSlider('volCtrl',   'volVal',   v => (+v).toFixed(2));      break;
    case 'steps':     setSlider('stepsCtrl', 'stepsVal', v => v);                    break;

    case 'statusUpdate': {
      document.getElementById('statusTxt').textContent = value;
      const paused = value === 'PHASE FROZEN';
      const ph = document.getElementById('btnPhase');
      ph.classList.toggle('paused', paused);
      ph.textContent = paused ? '▶   Resume phasing' : '⏸   Pause phasing';
      break;
    }

    case 'playingUpdate': {
      const btn = document.getElementById('btnPlay');
      btn.classList.toggle('on', value);
      btn.textContent = value ? '■   Stop' : '▶   Start';
      break;
    }
  }
}

connect();
</script>
</body>
</html>
